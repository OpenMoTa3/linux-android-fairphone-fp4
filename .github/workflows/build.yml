name: Build FP4 Droidian Kernel (.deb)

on:
  push:
    branches: [ droidian ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Prepare official directory structure (host)
        run: |
          set -e
          export KERNEL_DIR="$HOME/droidian/kernel/vendor/device"
          export PACKAGES_DIR="$HOME/droidian/packages"
          mkdir -p "$KERNEL_DIR"
          mkdir -p "$PACKAGES_DIR"
          cp -a "${{ github.workspace }}/." "$KERNEL_DIR/"
          cd "$KERNEL_DIR"
          if [ "$(git branch --show-current)" != "droidian" ]; then
            git checkout -b droidian || git checkout droidian
          fi
          git status

      - name: Build & Package inside Droidian Docker (Official Flow)
        run: |
          set -e
          export KERNEL_DIR="$HOME/droidian/kernel/vendor/device"
          export PACKAGES_DIR="$HOME/droidian/packages"
          docker run --rm \
            -v "$PACKAGES_DIR:/buildd" \
            -v "$KERNEL_DIR:/buildd/sources" \
            -w /buildd/sources \
            quay.io/droidian/build-essential:current-amd64 \
            bash -c '
          set -e

          apt install linux-packaging-snippets
         

          # 3. 官方步骤：创建 Debian 打包骨架
          cd /buildd/sources
          mkdir -p debian/source
          if [ ! -f debian/kernel-info.mk ]; then
            cp -v /usr/share/linux-packaging-snippets/kernel-info.mk.example debian/kernel-info.mk
          fi
          echo 13 > debian/compat
          echo "3.0 (native)" > debian/source/format
          if [ ! -f debian/rules ]; then
            printf "#!/usr/bin/make -f\n\ninclude /usr/share/linux-packaging-snippets/kernel-snippet.mk\n\n%%:\n\tdh \$@\n" > debian/rules
          fi
          chmod +x debian/rules

          # 4. 按 FP4 实际值写入 kernel-info.mk 字段
          set_kv() {
            key="$1"; val="$2"
            if grep -q "^${key}" debian/kernel-info.mk; then
              sed -i "s|^${key}.*|${key} = ${val}|" debian/kernel-info.mk
            else
              echo "${key} = ${val}" >> debian/kernel-info.mk
            fi
          }
          set_kv DEVICE_VENDOR "fairphone"
          set_kv DEVICE_MODEL "fp4"
          set_kv DEVICE_FULL_NAME "Fairphone 4"
          set_kv VARIANT "android"
          set_kv KERNEL_BASE_VERSION "4.19-0"
          set_kv DEB_BUILD_ON "amd64"
          set_kv DEB_BUILD_FOR "arm64"
          set_kv CLANG_VERSION "10.0-r370808"
          set_kv KERNEL_BOOTIMAGE_CMDLINE "console=tty0 console=ttyMSM0,115200,n8 droidian.lvm.prefer"
          set_kv KERNEL_BOOTIMAGE_PAGE_SIZE "4096"
          set_kv KERNEL_BOOTIMAGE_BASE_OFFSET "0x0"
          set_kv KERNEL_BOOTIMAGE_KERNEL_OFFSET "0x8000"
          set_kv KERNEL_BOOTIMAGE_INITRAMFS_OFFSET "0x1000000"
          set_kv KERNEL_BOOTIMAGE_TAGS_OFFSET "0x100"
          set_kv KERNEL_BOOTIMAGE_VERSION "2"
          set_kv KERNEL_IMAGE_WITH_DTB "0"

          # 5. 生成 debian/control
          rm -f debian/control
          debian/rules debian/control

          # 7. 构建内核并打包
          RELENG_HOST_ARCH="arm64" releng-build-package
            '

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-debs
          path: /home/runner/droidian/packages/*.deb
          if-no-files-found: error
